<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockup Én Vàng — bố cục menu trái</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* MOCKUP v4 (dữ liệu giả, chỉ để xem bố cục). Menu trái + dữ liệu phải; dưới 900px thành thanh menu đáy.
   Quy ước: khoảng cách 4/8/12/16/24; bo góc 8 (nút, ô nhập) và 12 (thẻ); mỗi màn chỉ một nút chính màu vàng. */
:root {
  --bg: #F5F6F8; --surface: #FFFFFF; --ink: #17202B; --muted: #5B6676; --line: #E2E6EC;
  --accent: #F2B705; --accent-ink: #2E2200; --accent-soft: #FFF6D6;
  --warn: #8A5200; --warn-bg: #FFF2C2; --bad: #B3261E; --bad-bg: #FDECEA; --good: #11703F; --good-bg: #E4F4EB;
  --scrim: rgba(15, 20, 26, .5);
  --font: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
:root[data-theme="dark"] {
  --bg: #0F141A; --surface: #1A212A; --ink: #EDF0F4; --muted: #9AA5B4; --line: #2C3541; --accent-soft: #3A3210;
  --warn: #F0B04A; --warn-bg: #3A3210; --bad: #F28B82; --bad-bg: #3B1F1E; --good: #5BC58A; --good-bg: #16301F;
  --scrim: rgba(0, 0, 0, .62); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -48px; z-index: 100; padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); }
.skip:focus { top: 8px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-weight: 600; }
h1, h2 { margin: 0; }

/* ===== Khung: menu trái + vùng dữ liệu phải ===== */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100dvh; }
.side { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 20px; padding: 16px 12px; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.logo { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; }
.brand b { display: block; font-size: 15px; line-height: 1.2; }
.brand span { font-size: 12px; color: var(--muted); }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navlabel { padding: 0 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-weight: 500; transition: background .15s var(--ease); }
.nav:hover { background: var(--bg); }
.nav[aria-current="page"] { background: var(--accent-soft); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.nav .badge { margin-left: auto; min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 600; text-align: center; }
:root[data-theme="dark"] .nav .badge { color: #2b0b09; }
.side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 12px; border-top: 1px solid var(--line); }
.sync { display: flex; align-items: center; gap: 8px; padding: 0 10px 8px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.switch { position: relative; width: 38px; height: 22px; margin-left: auto; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); transition: background .2s var(--ease); flex: 0 0 auto; }
.switch i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .2s var(--ease), background .2s; }
[aria-checked="true"] .switch { background: var(--accent); border-color: var(--accent); }
[aria-checked="true"] .switch i { transform: translateX(16px); background: var(--accent-ink); }
.nav.out { color: var(--bad); }

.main { min-width: 0; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 24px; max-width: 1240px; width: 100%; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.top h1 { font-size: 22px; line-height: 1.25; }
.top .sub { color: var(--muted); font-size: 13px; }
.top > div:first-child { flex: 1 1 240px; min-width: 0; }
.top .grow { display: none; }
.search { display: flex; align-items: center; gap: 8px; width: 280px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.search input { flex: 1; min-width: 0; min-height: 38px; border: 0; background: none; outline: 0; }
.search:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
#searchBtn { display: none; }

/* ===== Nút, ô nhập, chip lọc ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 500; white-space: nowrap; transition: border-color .15s var(--ease), background .15s var(--ease); }
.btn:hover { border-color: var(--muted); }
.btn:active { background: var(--bg); }
.btn.icon { width: 38px; padding: 0; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--bg); color: var(--ink); }
.btn.ghost.danger:hover { color: var(--bad); background: var(--bad-bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(.96); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .btn.danger { color: #2b0b09; }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 13px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; min-height: 36px; padding: 6px 12px; font-weight: 500; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg[hidden] { display: none; }
.in { width: 100%; min-height: 40px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
select.in, select.field { appearance: auto; }
.field { min-height: 36px; min-width: 150px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.field.amt { min-width: 112px; width: 120px; text-align: right; font-variant-numeric: tabular-nums; }

/* ===== Thẻ: thống kê và bảng ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.ch { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 16px 20px 12px; }
.ch h2 { font-size: 15px; font-weight: 600; }
.ch .muted { font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .k { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.stat .v { font-size: 20px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .d { font-size: 12px; color: var(--muted); }
.stat.alert .v { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
.datenav { display: flex; align-items: center; gap: 4px; }
.datenav .date { min-width: 108px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 8px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--bg); }
tr.sua td { background: var(--warn-bg); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.acts { display: flex; justify-content: flex-end; gap: 4px; }
.tag { display: inline-block; margin-left: 6px; padding: 0 7px; border: 1px solid var(--line); border-radius: 999px; font: 600 11px/18px var(--font); color: var(--muted); vertical-align: 1px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.pill svg.i { width: 13px; height: 13px; }
.pill.soon, .pill.sua { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.pill.over { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.pill.lai2 { color: var(--ink); border-color: var(--ink); }
.ok { display: inline-flex; align-items: center; gap: 4px; color: var(--good); font-weight: 600; font-size: 13px; }
.ok svg.i { width: 15px; height: 15px; }
.dt { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.dt.soon { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.dt.over { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.dt svg.i { width: 13px; height: 13px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 0 20px 14px; }
.toolbar .grow { flex: 1 1 auto; }
.toolbar label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0 12px 12px; }
.list li { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.list small { display: block; color: var(--muted); font-size: 12px; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; gap: 10px; height: 170px; padding: 8px 20px 0; }
.col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
.col i { display: block; width: 100%; max-width: 44px; border-radius: 6px 6px 0 0; background: var(--line); }
.col.today i { background: var(--accent); }
.col b { font-size: 11px; font-variant-numeric: tabular-nums; }
.col span { font-size: 12px; color: var(--muted); padding-bottom: 12px; }
.top1row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.top1 { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; border-left: 4px solid var(--accent); }
.t1k { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.t1k svg.i { width: 15px; height: 15px; color: var(--accent); }
.t1n { margin-top: 2px; font-size: 16px; font-weight: 700; line-height: 1.25; }
.t1v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.t1v small { margin-left: 2px; font-size: 12px; font-weight: 500; color: var(--muted); }
.t1d { min-height: 18px; font-size: 12px; color: var(--muted); }
.weekbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.rkcols { display: grid; grid-template-columns: 1fr 1fr; }
.rklist { min-width: 0; padding: 0 20px 12px; }
.rklist + .rklist { border-left: 1px solid var(--line); }
.rkh { padding: 4px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rk { border-top: 1px solid var(--line); }
.rk summary { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto 16px; align-items: center; gap: 4px 10px; min-height: 48px; padding: 10px 0; list-style: none; cursor: pointer; }
.rk summary::-webkit-details-marker { display: none; }
.rk .rank { justify-content: center; width: 28px; height: 28px; padding: 0; border-radius: 50%; }
.rk .nm { min-width: 0; font-weight: 600; }
.rk .tot { font-weight: 700; font-variant-numeric: tabular-nums; }
.rk .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .2s var(--ease); }
.rk[open] .chev { transform: rotate(90deg); }
.bar2 { grid-column: 2 / -1; height: 4px; border-radius: 2px; background: var(--line); }
.bar2 i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 0 12px 38px; }
.days span { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.days b { font-size: 11px; font-weight: 600; color: var(--muted); }
.rktabs { display: none; padding: 0 16px 8px; }
.award { align-self: flex-start; margin-top: 4px; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 600; }

/* ===== Popup nhập liệu (điện thoại: trượt từ đáy lên) ===== */
.scrim { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--scrim); animation: fade .18s var(--ease); }
.scrim[hidden] { display: none; }
.modal { width: min(520px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; box-shadow: 0 20px 48px rgba(0, 0, 0, .28); animation: pop .2s var(--ease); }
.mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 8px; }
.mh h2 { font-size: 17px; }
.mb { padding: 8px 20px 16px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.mb .full { grid-column: 1 / -1; }
.mb p { margin: 0; color: var(--muted); }
.mf { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > label, .fld > .lab { font-size: 12px; font-weight: 600; color: var(--muted); }
.req { color: var(--bad); }
.hint { font-size: 12px; color: var(--muted); }
.err { min-height: 0; font-size: 12px; color: var(--bad); }
.in.bad { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.segr { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.segr label { position: relative; }
.segr input { position: absolute; opacity: 0; inset: 0; }
.segr span { display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 12px; font-weight: 500; cursor: pointer; }
.segr label + label span { border-left: 1px solid var(--line); }
.segr input:checked + span { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.segr input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: -2px; }
.docs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sep { grid-column: 1 / -1; margin: 4px 0 -4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 80; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 500; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: transform .22s var(--ease), opacity .22s var(--ease); }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes sheet { from { transform: translateY(40px); opacity: 0; } }

/* ===== Thanh menu đáy (điện thoại) ===== */
.bottom, .more { display: none; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding: 12px 16px 96px; gap: 12px; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title sbtn" "seat seat" "search search"; gap: 8px; align-items: center; }
  .top > div:first-child { grid-area: title; min-width: 0; }
  .top .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .grow { display: none; }
  .top h1 { font-size: 19px; }
  #searchBtn { display: inline-flex; grid-area: sbtn; }
  #seatf { grid-area: seat; width: 100%; }
  .top .search { grid-area: search; display: none; width: 100%; }
  .top.searching .search { display: flex; }
  /* thẻ chỉ số gộp thành MỘT thẻ, 2 ô mỗi hàng, ngăn bằng đường kẻ mảnh; dòng phụ chỉ giữ ở thẻ cảnh báo */
  .stats { gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats > .stat { gap: 2px; padding: 10px 14px; border: 0; border-radius: 0; }
  .stats > .stat:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .stat .k, .stat .d { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .d { display: none; }
  .stat.alert .d { display: block; }
  .stat .v { font-size: clamp(15px, 4.4vw, 18px); }
  .top1 { padding: 10px 12px; }
  .t1n { font-size: 15px; }
  .t1v { font-size: 17px; }
  .t1d { display: none; }
  .weekbar .datenav { width: 100%; }
  .rktabs { display: block; }
  .rkcols { grid-template-columns: 1fr; }
  .rklist { display: none; padding: 0 16px 8px; }
  .rklist.on { display: block; }
  .rklist + .rklist { border-left: 0; }
  .rkh { display: none; }
  .ch { padding: 12px 16px 8px; }
  .toolbar { padding: 0 16px 12px; }
  .ch .datenav { width: 100%; }
  .datenav .date { min-width: 0; flex: 1; }
  .bottom { position: fixed; inset: auto 0 0 0; z-index: 40; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0); }
  .bottom button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; border: 0; background: none; font-size: 11px; font-weight: 500; color: var(--muted); }
  .bottom button[aria-current="page"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 3px 0 var(--accent); }
  .more { position: fixed; right: 12px; bottom: 72px; z-index: 50; min-width: 230px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, .2); }
  .more[data-open="1"] { display: block; }
  .more .nav { min-height: 44px; }
  .btn, .seg button, .field, .search input, .in { min-height: 44px; }
  .btn.icon { width: 44px; }
  .btn.sm { min-height: 44px; }
  .acts { gap: 4px; }
  .toast { bottom: 76px; max-width: calc(100% - 32px); }
  /* popup thành tấm trượt từ đáy lên */
  .scrim { align-items: flex-end; padding: 0; }
  .modal { width: 100%; max-height: 92dvh; border-radius: 16px 16px 0 0; animation: sheet .24s var(--ease); }
  .mb { grid-template-columns: 1fr; }
  .docs { grid-template-columns: 1fr 1fr; }
  /* bảng nhập liệu thành thẻ dọc */
  table.stack thead { display: none; }
  table.stack, table.stack tbody { display: block; }
  table.stack tr { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  table.stack tr:last-child { border-bottom: 0; }
  table.stack td { display: block; padding: 0; border: 0; min-width: 0; white-space: normal; }
  table.stack tbody tr:hover td { background: none; }
  table.stack.entry td:nth-child(n+3), table.stack.sched td:nth-child(3), table.stack.sched td[colspan] { grid-column: 1 / -1; }
  table.stack .field { width: 100%; }

    if (f.type === 'seg') return '<div class="fld ' + (f.full ? 'full' : '') + '" role="radiogroup" aria-labelledby="l-' + id + '"><span class="lab" id="l-' + id + '">' + f.label + '</span><div class="segr">' +
      f.opts.map(function (o) { return '<label><input type="radio" name="' + f.k + '" value="' + o[0] + '"' + (String(v) === String(o[0]) ? ' checked' : '') + '><span>' + o[1] + '</span></label>'; }).join('') + '</div>' + hint + '</div>';
    return '<div class="fld ' + (f.full ? 'full' : '') + '"><label for="' + id + '">' + f.label + (f.req ? ' <span class="req" aria-hidden="true">*</span>' : '') + '</label><input class="in" id="' + id + '" name="' + f.k + '" type="' + (f.type || 'text') + '" value="' + esc(v) + '"' + (f.req ? ' required aria-describedby="e-' + id + '"' : '') + (f.type === 'tel' ? ' inputmode="tel"' : '') + ' autocomplete="off">' + hint + '<span class="err" id="e-' + id + '" role="alert"></span></div>';
  }
  function openModal(cfg, opener) {
    M.cfg = cfg; M.opener = opener || document.activeElement;
    $('#mt').textContent = cfg.title;
    $('#mform').innerHTML = cfg.text ? '<p class="full">' + cfg.text + '</p>' : cfg.fields.map(function (f) { return f.sep ? '<div class="sep">' + f.sep + '</div>' : fieldHTML(f); }).join('');
    var save = $('#msave'); save.textContent = cfg.submit || 'Lưu'; save.className = 'btn ' + (cfg.danger ? 'danger' : 'primary');
    $('#scrim').hidden = false; document.body.style.overflow = 'hidden';
    var first = $('#mform input:not([type=radio])') || $('#mform input') || $('#mcancel'); (cfg.danger ? $('#mcancel') : first).focus();
  }
  function closeModal() { $('#scrim').hidden = true; document.body.style.overflow = ''; if (M.opener && M.opener.focus) M.opener.focus(); M.cfg = null; }
  function submitModal(e) {
    e.preventDefault(); if (!M.cfg) return;
    var vals = {}, bad = null;
    $$('#mform .in').forEach(function (el) { vals[el.name] = el.value.trim(); var er = $('#e-' + el.id); if (er) er.textContent = ''; el.classList.remove('bad'); if (el.required && !vals[el.name]) { el.classList.add('bad'); var lb = $('label[for="' + el.id + '"]'); if (er) er.textContent = 'Nhập ' + (lb ? lb.textContent.replace('*', '').trim().toLowerCase() : 'thông tin này') + '.'; bad = bad || el; } });
    $$('#mform input[type=radio]:checked').forEach(function (el) { vals[el.name] = el.value; });
    if (bad) { bad.focus(); return; }
    var cfg = M.cfg; closeModal(); cfg.onSave && cfg.onSave(vals); render(); if (cfg.toast) toast(cfg.toast);
  }
  var toastTimer;
  function toast(msg) { var t = $('#toast'); t.innerHTML = ICON('check') + esc(msg); t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3200); }

  function driverModal(i, opener) {
    var d = i == null ? { name: '', phone: '', address: '', note: '', lai: 1, active: true } : DRIVERS[i];
    openModal({ title: i == null ? 'Thêm tài xế' : 'Sửa tài xế', submit: i == null ? 'Thêm tài xế' : 'Lưu', toast: i == null ? 'Đã thêm tài xế' : 'Đã lưu thay đổi',
      fields: [{ k: 'name', label: 'Họ tên', req: 1, val: d.name, full: 1 }, { k: 'phone', label: 'Số điện thoại', type: 'tel', val: d.phone }, { k: 'address', label: 'Địa chỉ', val: d.address },
        { k: 'lai', label: 'Số lái', type: 'seg', opts: [[1, '1 lái'], [2, '2 lái']], val: d.lai, hint: '1 lái: xe chạy một tài xế. 2 lái: hai tài xế thay ca trên một xe.', full: 1 },
        { k: 'note', label: 'Ghi chú', val: d.note, full: 1 }].concat(i == null ? [] : [{ k: 'active', label: 'Trạng thái', type: 'seg', opts: [[1, 'Đang làm'], [0, 'Nghỉ việc']], val: d.active ? 1 : 0, full: 1 }]),
      onSave: function (v) { var o = { name: v.name, phone: v.phone, address: v.address, note: v.note, lai: +v.lai, active: v.active == null ? true : v.active === '1' }; if (i == null) DRIVERS.push(o); else DRIVERS[i] = o; } }, opener);
  }
  function carModal(id, opener) {
    var c = id == null ? { id: '', plate: '', seats: S.seats === '7' ? 7 : 4, docs: ['', '', '', '', ''] } : carById(id);
    openModal({ title: id == null ? 'Thêm đàm' : 'Sửa đàm ' + id, submit: id == null ? 'Thêm đàm' : 'Lưu', toast: id == null ? 'Đã thêm đàm' : 'Đã lưu thay đổi',
      fields: (id == null ? [{ k: 'id', label: 'Số đàm', req: 1, val: '' }] : []).concat([{ k: 'plate', label: 'Biển số', val: c.plate, req: id == null }, { k: 'seats', label: 'Số chỗ', type: 'seg', opts: [[4, '4 chỗ'], [7, '7 chỗ']], val: c.seats, full: 1 }, { sep: 'Hạn giấy tờ' }])
        .concat(DOC_NAMES.map(function (n, i) { return { k: 'doc' + i, label: n, type: 'date', val: toIso(c.docs[i]) }; })),
      onSave: function (v) { var docs = DOC_NAMES.map(function (n, i) { return fromIso(v['doc' + i]); }); if (id == null) CARS.push({ id: v.id, plate: v.plate, seats: +v.seats, docs: docs }), ENTRY[v.id] = { s: 'pending' }, SCHED[v.id] = ''; else { c.plate = v.plate; c.seats = +v.seats; c.docs = docs; } } }, opener);
  }
  function confirmModal(title, text, label, onYes, opener) { openModal({ title: title, text: text, danger: 1, submit: label, toast: 'Đã xóa', onSave: onYes }, opener); }

  /* ---------- sự kiện ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, .scrim'); if (!t) return;
    if (t.id === 'scrim' && e.target === t) return closeModal();
    if (t.dataset.v) { S.view = t.dataset.v; S.filter = 'all'; render(); window.scrollTo(0, 0); return; }
    var id = t.dataset.id, a = t.dataset.act;
    if (t.id === 'mx' || t.id === 'mcancel') return closeModal();
    if (t.id === 'searchBtn') { var tp = $('.top'), on = tp.classList.toggle('searching'); t.setAttribute('aria-expanded', String(on)); if (on) $('#q').focus(); return; }
    if (t.id === 'moreBtn') { var m = $('#more'); m.dataset.open = m.dataset.open === '1' ? '0' : '1'; t.setAttribute('aria-expanded', String(m.dataset.open === '1')); return; }
    if (a === 'theme') { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; renderChrome(); return; }
    if (a === 'seat') { S.seats = t.dataset.f; render(); }
    else if (a === 'lai') { S.lai = t.dataset.f; render(); }
    else if (a === 'rtab') { S.rankTab = t.dataset.f; render(); }
    else if (a === 'metric') { S.metric = t.dataset.f; render(); }
    else if (a === 'cfilter') { S.filter = t.dataset.f; render(); }
    else if (a === 'day') { S.dayOff = t.dataset.n === '0' ? 0 : S.dayOff + Number(t.dataset.n); render(); }
    else if (a === 'copy') toast('Đã chép lịch hôm trước cho các đàm còn trống');
    else if (a === 'add-driver') driverModal(null, t);
    else if (a === 'edit-driver') driverModal(+id, t);
    else if (a === 'del-driver') confirmModal('Xóa tài xế?', 'Xóa <b>' + esc(DRIVERS[+id].name) + '</b>? Doanh thu đã nhập của tài xế này vẫn được giữ. Nếu chỉ nghỉ việc, nên đổi trạng thái thành "Nghỉ việc".', 'Xóa tài xế', function () { DRIVERS.splice(+id, 1); }, t);
    else if (a === 'add-car') carModal(null, t);
    else if (a === 'edit-car') carModal(id, t);
    else if (a === 'del-car') confirmModal('Xóa đàm ' + id + '?', 'Đàm đã có doanh thu thì không xóa được. Bạn chắc chắn muốn xóa đàm này?', 'Xóa đàm', function () { CARS.splice(CARS.indexOf(carById(id)), 1); }, t);
    else if (a === 'save-row') { var row = t.closest('tr'), sel = $('select', row), inp = $('input', row), val = Number((inp.value || '').replace(/\D/g, '')); if (!sel.value || !val) { (sel.value ? inp : sel).focus(); toast('Chọn tài xế và nhập số tiền'); return; } ENTRY[id] = { d: sel.value, a: val, s: 'done' }; render(); toast('Đã lưu đàm ' + id); }
    else if (a === 'nghi-row') { ENTRY[id] = { s: 'nghi' }; render(); }
    else if (a === 'sua-row') { ENTRY[id] = { s: 'sua' }; render(); }
    else if (a === 'edit-row') { ENTRY[id] = { d: ENTRY[id].d, s: 'pending' }; render(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.sel === 'sched') { SCHED[t.dataset.id] = t.value; render(); }
    else if (t.dataset.sel === 'entry') { ENTRY[t.dataset.id].d = t.value; }
    else if (t.dataset.act === 'doc') { S.doc = t.value; render(); }
  });
  $('#q').addEventListener('input', function (e) { S.q = e.target.value; render(); });
  $('#mform').addEventListener('submit', submitModal);
  document.addEventListener('keydown', function (e) {
    if ($('#scrim').hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); return closeModal(); }
    if (e.key === 'Tab') { // giữ phím Tab trong popup
      var f = $$('#scrim button, #scrim input, #scrim select').filter(function (x) { return !x.disabled && x.offsetParent !== null && !(x.type === 'radio' && !x.checked && $('input[name="' + x.name + '"]:checked', $('#mform'))); });
      if (!f.length) return; var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  render();
})();
</script>
</body></html>
