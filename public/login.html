<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng nhập · Doanh thu Én Vàng</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root { --bg:#F2F4F7; --surface:#fff; --ink:#17202B; --muted:#5B6676; --line:#DCE1E8; --accent:#F2B705; --accent-ink:#2E2200; --bad:#B3261E;
  --font:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#11161C; --surface:#1A212A; --ink:#EDF0F4; --muted:#9AA5B4; --line:#2C3541; --bad:#F28B82; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:14px/1.5 var(--font);
  padding:24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
.card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:28px 24px; display:flex; flex-direction:column; gap:18px; }
.mark { width:44px; height:44px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font:600 15px var(--mono); }
h1 { font-size:20px; line-height:1.3; margin:0; font-weight:700; text-wrap:balance; }
p { margin:4px 0 0; color:var(--muted); }
label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.field { position:relative; }
input[type=password], input[type=text] { width:100%; min-height:44px; padding:8px 76px 8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; font-size:16px; }
input:focus-visible { outline:2px solid var(--ink); outline-offset:1px; }
.show { position:absolute; right:6px; top:50%; transform:translateY(-50%); min-height:32px; padding:0 10px; border:0; background:none; color:var(--muted); font:inherit; font-size:13px; cursor:pointer; border-radius:6px; }
.show:hover { color:var(--ink); }
button.go { min-height:44px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:8px; font:inherit; font-weight:600; font-size:15px; cursor:pointer; }
button.go:disabled { opacity:.6; cursor:default; }
.err { min-height:20px; color:var(--bad); font-size:13px; margin:0; }
.u { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
</style></head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">ÉV</div>
  <div>
    <h1>DOANH THU ÉN VÀNG</h1>
    <p>Đăng nhập để nhập và xem doanh thu các lái xe.</p>
  </div>
  <form id="f" autocomplete="on">
    <input class="u" type="text" name="username" value="en-vang" autocomplete="username" tabindex="-1" aria-hidden="true">
    <label for="pw">Mật khẩu</label>
    <div class="field">
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="button" class="show" id="tg" aria-label="Hiện mật khẩu">Hiện</button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="go" id="go" type="submit" style="width:100%">Đăng nhập</button>
  </form>
</main>
<script>
(function () {
  var f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go'), tg = document.getElementById('tg');
  tg.addEventListener('click', function () {
    var show = pw.type === 'password'; pw.type = show ? 'text' : 'password';
    tg.textContent = show ? 'Ẩn' : 'Hiện'; tg.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'); pw.focus();
  });
  f.addEventListener('submit', function (ev) {
    ev.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Đang đăng nhập…';
    fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }) })
      .then(function (r) {
        if (r.ok) { location.replace('/'); return; }
        err.textContent = r.status === 401 ? 'Sai mật khẩu, anh thử lại.' : 'Không đăng nhập được, thử lại sau.';
        go.disabled = false; go.textContent = 'Đăng nhập'; pw.select();
      })
      .catch(function () { err.textContent = 'Mất kết nối mạng.'; go.disabled = false; go.textContent = 'Đăng nhập'; });
  });
})();
</script>
</body></html>
